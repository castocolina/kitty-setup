# Phase 1 §5 — broadcast. One chord lands here. `ctrl+shift+i` opens
# kitty's official `broadcast` kitten in a new window inside the active
# tab; whatever the user types in that window is mirrored to every
# sibling kitty window. The kitten ships with kitty 0.46.x and is
# launched via `launch --allow-remote-control kitty +kitten broadcast`
# (the form documented in kitty's broadcast kitten manual). Probe
# finding (h15, 2026-05-06): kitty 0.46.x has no default on
# `ctrl+shift+i`, so this chord is genuinely new — no
# `intentional-overrides.conf` allow-list entry needed (same precedent
# as the §6 detach chords). The action string parses cleanly through
# kitty's binding introspection, surfacing verbatim in `my-kitty keys`.
# Behavioural confirmation that typing in the broadcast window mirrors
# to siblings lives in the manual repro — kitty remote control's
# `send-key` cannot drive interactive input. See
# openspec/changes/phase1-curated-bindings/design.md D5/D6 +
# docs/repro/h15-bindings-broadcast.md.

map ctrl+shift+i launch --allow-remote-control kitty +kitten broadcast
