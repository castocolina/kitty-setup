# Phase 1 §2 — instant clear (Linux variant).
#
# After phase1-curated-bindings-revert-defaults: clear moves off
# `ctrl+shift+x` (which returns to kitty's `scroll_to_prompt 1` default)
# onto the host-OS-native chord. On Linux this is `super+k` (iTerm Cmd+K
# cultural analogue under Pop!_OS / GNOME / KDE). `ctrl+shift+alt+k` is
# shipped as a cross-OS fallback in case a compositor grabs Super.
#
# This file is one of two OS variants. The installer copies the matching
# variant to `<payload>/clear.conf` at install time and removes the
# other variant — kitty-setup.conf only `include`s `clear.conf`. See
# openspec/changes/phase1-curated-bindings-revert-defaults/notes/clear-chord-os-mechanism.md
# and openspec/changes/phase1-curated-bindings-revert-defaults/design.md D5.

# clear_terminal scrollback active wipes screen + scrollback in one op;
# the trailing send_text issues a form-feed so the underlying shell
# repaints its prompt cleanly afterwards.
map super+k          combine : clear_terminal scrollback active : send_text normal,application \x0c
map ctrl+shift+alt+k combine : clear_terminal scrollback active : send_text normal,application \x0c
