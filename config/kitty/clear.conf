# Phase 1 §2 — instant clear: one keystroke wipes the visible screen and the
# scrollback buffer with no `reset` round-trip. Verified binding (Linux); see
# tests/integration/test_h02_clear.py and
# docs/repro/h09-bindings-clear-relocation.md.
#
# Chord history: originally `ctrl+shift+k`. Moved to `ctrl+shift+x` as part of
# the phase1-curated-bindings change so `ctrl+shift+k` can land on the vim-style
# window-nav-up chord. See docs/repro/h09-bindings-clear-relocation.md.

# clear_terminal scrollback active wipes screen + scrollback in one op; the
# trailing send_text issues a form-feed so the underlying shell repaints its
# prompt cleanly afterwards.
map ctrl+shift+x combine : clear_terminal scrollback active : send_text normal,application \x0c
