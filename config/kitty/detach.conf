# Phase 1 §5 — detach. Two chords land here, both genuinely new (no
# kitty default on either chord). `ctrl+shift+d` detaches the active
# window into a tab the user picks; `ctrl+shift+alt+d` detaches the
# active tab into an OS window the user picks. Both use the `ask`
# variant so kitty opens an interactive picker — matches the §6 spec
# wording "or kitty-supported equivalent that prompts the user for
# target". Probe finding (h14, 2026-05-06): kitty 0.46.x has neither
# chord bound by default, so neither needs an
# `intentional-overrides.conf` allow-list entry. See
# openspec/changes/phase1-curated-bindings/design.md D5/D6 +
# docs/repro/h14-bindings-detach.md.

map ctrl+shift+d detach_window ask
map ctrl+shift+alt+d detach_tab ask
