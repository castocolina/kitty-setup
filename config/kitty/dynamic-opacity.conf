# Phase 2 §10 — runtime opacity precondition.
#
# Owner: phase2-scene-styling change, kitty-scenes capability.
#
# Required by `my-kitty os-window opacity` (and any other caller of
# `kitten @ set-background-opacity`). Without this directive kitten errors with:
#   "You must turn on the dynamic_background_opacity option in kitty.conf
#    to be able to set background opacity"
#
# Visual impact on hosts that never invoke `my-kitty os-window opacity`: ZERO.
# Kitty's default opacity stays at 1.0 (fully opaque) until the opacity
# primitive runs; this directive only enables the runtime command path.

dynamic_background_opacity yes
