# Phase 1 §5 — font zoom (revert).
#
# After phase1-curated-bindings-revert-defaults: every line here is a
# redundant rebind of a kitty 0.46.x default. The `ctrl+shift+0` →
# font-reset override was dropped (kitty maps `0` to `tenth_window` by
# default and binds reset on `ctrl+shift+backspace` — restated here
# under the obvious kitty chord). The category exists so `my-kitty keys`
# groups these chords under `font-zoom` rather than scattering them.
#
# See openspec/changes/phase1-curated-bindings-revert-defaults/design.md D4.
#
# All three lines below are redundant rebinds (same action as the kitty
# default); none need an allow-list entry.

map ctrl+shift+= change_font_size all +2.0
map ctrl+shift+- change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
