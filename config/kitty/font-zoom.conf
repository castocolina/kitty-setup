# Phase 1 §5 — font zoom. Three chords land here. Two are redundant
# rebinds (`=` → `change_font_size all +2.0`, `-` → `change_font_size all
# -2.0`, same action as the kitty default, lifted into this file so
# `my-kitty keys` groups them under `font-zoom` instead of `kitty
# defaults`). One REPLACES a kitty default: `ctrl+shift+0` swaps kitty's
# `tenth_window` for `change_font_size all 0` (font reset). Probe finding
# (h13, 2026-05-06): design.md D6 listed `ctrl+shift+0` as a kitty
# default for the reset action; it is not — kitty 0.46.x maps reset to
# `ctrl+shift+backspace` and uses `ctrl+shift+0` for `tenth_window`. The
# §5 spec wants reset on `0` (the obvious chord), so we override.
# `ctrl+shift+-` is now ours after the §2 hsplit relocation freed it.
# See `intentional-overrides.conf` for chord-by-chord rationale, and
# openspec/changes/phase1-curated-bindings/design.md D5/D6 +
# docs/repro/h13-bindings-font-zoom.md.

map ctrl+shift+= change_font_size all +2.0
map ctrl+shift+- change_font_size all -2.0
map ctrl+shift+0 change_font_size all 0
