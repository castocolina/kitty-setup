# Allow-list for chords where our binding intentionally shadows a kitty default.
# Each line is a single chord in canonical explicit-modifier form. Comment lines
# (starting with `#`) and blank lines are ignored.
#
# A chord listed here is reported by `my-kitty keys` as `[overrides default <action>]`
# instead of `[CONFLICT: kitty default <action>]`. The `bindings` doctor check
# treats listed overrides as healthy (PASS) and unlisted shadows as failures.
#
# This file is NOT parsed by kitty itself — it is metadata consumed by our
# binding introspection module. Reviewer-enforced; keep entries justified inline.

# windowing.conf — cwd-inheriting replacements for default tab/window/split chords.
ctrl+shift+t       # overrides new_tab
ctrl+shift+n       # overrides new_os_window
ctrl+shift+enter   # overrides new_window
ctrl+shift+/       # overrides search_scrollback (we use this for hsplit; scrollback search is not in scope for v1)

# clear.conf — instant clear lives on ctrl+shift+x.
ctrl+shift+x       # overrides scroll_to_prompt 1 (instant-clear is the documented behaviour)

# tab-nav.conf — bring tab-navigation chords into the tab-nav section. Three are
# redundant rebinds (same action as kitty default); two replace kitty's default
# window-nav action with the matching tab-nav action (kitty 0.46.x maps
# ctrl+shift+]/[ to next_window/previous_window, which conflicts with our
# vim-style window-nav category landing in §4 — tab-nav owns these chords).
ctrl+shift+]       # overrides next_window (we bind next_tab; window-nav uses ctrl+shift+l)
ctrl+shift+[       # overrides previous_window (we bind previous_tab; window-nav uses ctrl+shift+h)
ctrl+shift+.       # redundant binding for tab-nav.conf categorisation; same action as kitty default (move_tab_forward)
ctrl+shift+,       # redundant binding for tab-nav.conf categorisation; same action as kitty default (move_tab_backward)
ctrl+shift+q       # redundant binding for tab-nav.conf categorisation; same action as kitty default (close_tab)

# window-nav.conf — vim-style window navigation + close + cycle. Five chords
# replace different kitty defaults; one (`w`) is a redundant rebind. Probe
# finding (h12, 2026-05-06): kitty 0.46.x maps h/j/k/l/f to
# show_scrollback/scroll_line_down/scroll_line_up/next_layout/move_window_forward
# — design.md D6 originally listed h/j/k/l as "new" (i.e. unbound); they are
# not. All six entries below are required for `0 conflicts`.
ctrl+shift+h       # overrides show_scrollback (we bind neighboring_window left)
ctrl+shift+j       # overrides scroll_line_down (we bind neighboring_window down)
ctrl+shift+k       # overrides scroll_line_up (we bind neighboring_window up; freed from instant-clear in §1)
ctrl+shift+l       # overrides next_layout (we bind neighboring_window right)
ctrl+shift+w       # redundant binding for window-nav.conf categorisation; same action as kitty default (close_window)
ctrl+shift+f       # overrides move_window_forward (we bind next_window for round-robin focus cycling)

# font-zoom.conf — font size in/out/reset. Two chords are redundant rebinds
# (same action as kitty default); one (`0`) replaces kitty's `tenth_window`
# default with `change_font_size all 0` (the §5-spec reset chord). Probe
# finding (h13, 2026-05-06): design.md D6 listed `ctrl+shift+0` → reset as
# a kitty default; it is not — kitty 0.46.x defaults `ctrl+shift+0` to
# `tenth_window` and binds reset on `ctrl+shift+backspace`. The §5 spec
# wants reset on `0`, so we override. `ctrl+shift+-` was ours pre-§2
# (hsplit) and was relocated to `ctrl+shift+/` to free the chord for this
# category — closes the "fix-ctrl-shift-minus-collision" follow-up named
# in the archived `phase1-binding-introspection` proposal.
ctrl+shift+=       # redundant binding for font-zoom.conf categorisation; same action as kitty default (change_font_size all +2.0)
ctrl+shift+-       # redundant binding for font-zoom.conf categorisation; same action as kitty default (change_font_size all -2.0)
ctrl+shift+0       # overrides tenth_window (we bind change_font_size all 0 — font reset on the obvious chord)

# url-hints.conf — open URL hints overlay. Probe finding (h16, 2026-05-06):
# kitty 0.46.x defaults `ctrl+shift+e` to `open_url_with_hints`, so this is a
# true redundant rebind for categorisation. Restated under url-hints.conf so
# the chord surfaces under the `url-hints` section in `my-kitty keys`.
ctrl+shift+e       # redundant binding for url-hints.conf categorisation; same action as kitty default (open_url_with_hints)
