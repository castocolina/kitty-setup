# Allow-list for chords where our binding intentionally shadows a kitty default.
# Each line is a single chord in canonical explicit-modifier form. Comment lines
# (starting with `#`) and blank lines are ignored.
#
# A chord listed here is reported by `my-kitty keys` as `[overrides default <action>]`
# instead of `[CONFLICT: kitty default <action>]`. The `bindings` doctor check
# treats listed overrides as healthy (PASS) and unlisted shadows as failures.
#
# This file is NOT parsed by kitty itself — it is metadata consumed by our
# binding introspection module. Reviewer-enforced; keep entries justified inline.

# windowing.conf — cwd-inheriting replacements for default tab/window/split chords.
ctrl+shift+t       # overrides new_tab
ctrl+shift+n       # overrides new_os_window
ctrl+shift+enter   # overrides new_window

# bindings.conf — instant clear replaces scroll_line_up.
ctrl+shift+k       # overrides scroll_line_up
