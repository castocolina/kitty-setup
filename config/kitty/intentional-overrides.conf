# Allow-list for chords where our binding intentionally shadows a kitty default.
# Each line is a single chord in canonical explicit-modifier form. Comment lines
# (starting with `#`) and blank lines are ignored.
#
# A chord listed here is reported by `my-kitty keys` as `[overrides default <action>]`
# instead of `[CONFLICT: kitty default <action>]`. The `bindings` doctor check
# treats listed overrides as healthy (PASS) and unlisted shadows as failures.
#
# This file is NOT parsed by kitty itself — it is metadata consumed by our
# binding introspection module. Reviewer-enforced; keep entries justified inline.
#
# After phase1-curated-bindings-revert-defaults: the list shrank from ~17 entries
# to 6. Every chord that semantically overrode a kitty default and has now been
# released back is removed; redundant rebinds (same action as kitty default) do
# NOT need allow-list entries because the introspection module's same-(chord,
# action) dedupe keeps them clean. See design.md D7.

# windowing.conf — cwd-inheriting replacements for default tab/window/enter chords.
ctrl+shift+t       # overrides new_tab
ctrl+shift+n       # overrides new_os_window
ctrl+shift+enter   # overrides new_window

# clear.conf — instant clear on per-OS native chords + cross-OS fallback.
# All three chords are net-new (no kitty default fires on them); the allow-list
# entries exist for documentation, not because the introspection module flags
# them as overrides.
super+k            # Linux: new chord; no kitty default
cmd+k              # macOS: new chord; no kitty default
ctrl+shift+alt+k   # cross-OS fallback; no kitty default
