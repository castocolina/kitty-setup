# kitty-setup managed entry. Loaded via the sentinel-bracketed include in your
# main ~/.config/kitty/kitty.conf. Edit through this repo, not in place — your
# changes here will be overwritten by `make setup`.

# Pin kitty_mod so curated chords resolve to the same literal modifier on Linux
# (default ctrl+shift) and macOS (default cmd). The curated bindings author
# every `map` line in explicit-modifier form (`ctrl+shift+<key>`), but pinning
# kitty_mod keeps any kitty_mod-prefixed lines (in the upstream defaults or in
# user overrides) on the same physical chord across OSes.
kitty_mod ctrl+shift

include windowing.conf
include clear.conf
include tab-nav.conf
include window-nav.conf
include font-zoom.conf
include detach.conf
include broadcast.conf
include url-hints.conf
include monitor.conf
include remote-control.conf

# intentional-overrides.conf is NOT a kitty config file — it is metadata
# read by `my-kitty keys` / doctor. Do NOT `include` it here.
