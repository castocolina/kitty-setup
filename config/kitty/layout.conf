# Phase 2 §11 — one extra layout orientation beyond kitty defaults.
#
# Owner: phase2-extra-layout-mirrored-tall, kitty-curated-bindings.
#
# Ships one direct-jump chord to the mirrored Tall layout (main pane
# full-height on the right, the other panes stacked on the left). The kitty
# upstream documents the option as: "`mirrored` shifts the full-height
# windows to the right" (kitty/docs/layouts.rst).
#
# `enabled_layouts` MUST be pinned explicitly to a list that contains
# `tall:mirrored=true` — empirically verified by tmp/h24-tall-mirrored-right
# (Phase A vs Phase B). With kitty's default `enabled_layouts *`,
# `kitten @ goto-layout tall:mirrored=true` exits 0 with empty stderr but
# the option is SILENTLY IGNORED (layout_opts.mirrored stays "n"). With
# the explicit list below, the option is applied (mirrored=y) and the
# main pane lands on the right.
#
# The list is a strict superset of the 7 base layouts kitty's `*` would
# enable, plus `tall:mirrored=true`. Side effect: `ctrl+shift+l`
# (next_layout) now cycles through 8 entries instead of 7; the mirrored
# variant appears as a step immediately after plain `tall`. The return
# path from mirrored to plain Tall is multi-keystroke (cycle via
# `ctrl+shift+l`).

enabled_layouts tall,tall:mirrored=true,fat,grid,horizontal,vertical,splits,stack
map ctrl+shift+m goto_layout tall:mirrored=true
