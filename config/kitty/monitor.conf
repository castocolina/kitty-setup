# Phase 1 §6 — survive monitor disconnect / KVM switch / DPMS power-cycle.
#
# Probe finding (h18, 2026-05-11): on Pop!_OS 24.04 + COSMIC + kitty 0.46.2,
# kitty's native-Wayland backend exits the kitty process when an external
# monitor that hosts a kitty OS-window goes through an output reconfig
# (KVM switch, DPMS power-off, physical unplug). Other clients survive
# the same event:
#   - wezterm   (Wayland-native, Rust-based)  → survived
#   - xterm     (X11 via XWayland)            → survived
#   - chrome    (Wayland)                      → survived
# Only kitty native-Wayland dies. Bug is in kitty's GLFW-Wayland output
# handling.
#
# Workaround (probe-05): route kitty through XWayland (same path xterm
# uses, confirmed surviving) by pinning linux_display_server=x11. Bug
# vanishes; running shells inside kitty windows survive the event.
#
# Tradeoffs (documented in docs/repro/h18-monitor-disconnect-survival.md):
#   - native fractional scaling lost; HiDPI may differ
#   - Wayland-specific clipboard MIME and image-protocol bits lost
#   - native Wayland touch / gesture features lost
#   - font_size pinned to 16.0 (kitty default 11.0, ≈11.0 × 1.5 for a
#     150%-scaled Wayland display) to compensate for XWayland's lack of
#     fractional scaling — drop this line to restore kitty's default size
#     (see phase1-monitor-x11-font-bump). Tune the literal value if your
#     primary display uses a different compositor scale: target font_size
#     = 11.0 × <scale-factor> (e.g. 13.75 at 125%, 19.25 at 175%).
# For a daily-driver KVM workflow these are smaller than losing kitty
# windows on every monitor power-cycle.
#
# Follow-up: file an upstream kitty issue so a future kitty release can
# restore native Wayland survival. Tracked in the repro doc.

linux_display_server x11
# phase1-monitor-x11-font-bump (design D1/D2): compensate for XWayland's
# loss of Wayland fractional scaling so kitty text height matches surrounding
# native-Wayland apps. Value = kitty default (11.0) × primary-display
# compositor scale. 16.0 ≈ 11.0 × 1.5 for the DELL S2725QC at 150% (the
# user's primary display, 2026-05-12). Re-derive and edit if your daily
# host uses a different scale.
font_size 16.0
