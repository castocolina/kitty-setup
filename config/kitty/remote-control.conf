# Phase 2 §8-§14 foundation — remote-control surface.
#
# Phase 2 "scenes" capabilities drive kitty over its remote-control socket:
# `set-window-title`, `set-tab-color`, `launch`, etc. Without `allow_remote_control`
# and `listen_on` in the managed config, no scene script (invoked from a chord,
# from a shell, or from `my-kitty`) can reach the user's running kitty.
#
# `listen_on unix:/tmp/kitty` deliberately omits a `$KITTY_PID` placeholder —
# probe 01 of openspec/changes/phase2-remote-control-foundation showed that
# kitty 0.46.x does NOT substitute `$KITTY_PID` in `listen_on` values. It
# auto-appends `-<PID>` to the literal path on its own (documented behaviour),
# so the resolved per-instance socket is `/tmp/kitty-<PID>`.
#
# Security posture: single-user dev host. The socket is owned by the user; the
# kernel's UDS permission check scopes access by UID. `allow_remote_control yes`
# is the same posture every kitty user gets when they type `kitty @` in a window.
# See openspec/changes/phase2-remote-control-foundation/design.md D2 for the
# trade-off vs `socket-only` / `password` and the conditions under which to
# revisit (multi-user hosts).

allow_remote_control yes
listen_on unix:/tmp/kitty
