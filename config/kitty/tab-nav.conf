# Phase 1 §3 — tab navigation. Three chords (`.`, `,`, `q`) are redundant
# rebinds — same action as the kitty default, lifted here so `my-kitty keys`
# groups them under `tab-nav` instead of `kitty defaults`. Two chords (`]`,
# `[`) REPLACE kitty's defaults: kitty 0.46.x maps `ctrl+shift+]` to
# `next_window` and `ctrl+shift+[` to `previous_window`; tab-nav rebinds them
# to `next_tab`/`previous_tab` (window-nav lands on vim-style hjkl in §4).
# See `intentional-overrides.conf` for chord-by-chord rationale, and
# openspec/changes/phase1-curated-bindings/design.md D5/D6 +
# docs/repro/h11-bindings-tab-nav.md.

map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+shift+q close_tab
