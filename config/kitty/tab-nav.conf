# Phase 1 §5 — tab navigation (revert).
#
# After phase1-curated-bindings-revert-defaults: every line here is a
# redundant rebind of a kitty 0.46.x default. The `]`/`[` → tab-nav
# mapping has been dropped — those chords return to kitty's defaults
# (`next_window`/`previous_window`) and are restated under
# `window-nav.conf`. The category exists so `my-kitty keys` groups
# these chords under `tab-nav` rather than scattering them under
# "kitty defaults".
#
# See openspec/changes/phase1-curated-bindings-revert-defaults/design.md D3.
#
# All five lines below are redundant rebinds (same action as the kitty
# default); none need an allow-list entry.

map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
map ctrl+shift+q close_tab
