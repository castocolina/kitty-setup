# Phase 1 §5 — url-hints. One chord lands here. `ctrl+shift+e` opens
# kitty's URL-hint overlay over the active window: every URL visible in
# the current scrollback gets a one-or-two-letter hint label, and
# pressing the label opens the URL in `open_url_with` (the user's
# default browser unless overridden in kitty.conf). Probe finding
# (h16, 2026-05-06): kitty 0.46.x already binds `ctrl+shift+e` to
# `open_url_with_hints` by default, so this is a true redundant rebind
# — the same action as the kitty default, restated here so the chord
# surfaces under the `url-hints` section in `my-kitty keys` (file
# basename = category convention; see design.md D2/D5). The chord is
# allow-listed in `intentional-overrides.conf` with the standard
# "redundant binding for url-hints.conf categorisation; same action as
# kitty default" comment. See
# openspec/changes/phase1-curated-bindings/design.md D5/D6 +
# docs/repro/h16-bindings-url-hints.md.

map ctrl+shift+e open_url_with_hints
