# Phase 1 §4 — window/split navigation. Six chords land here. One is a
# redundant rebind (`w` → `close_window`, same action as kitty default,
# lifted into this file so `my-kitty keys` groups it under `window-nav`).
# Five REPLACE kitty defaults: `h/j/k/l` swap kitty's per-chord defaults
# (`show_scrollback`, `scroll_line_down`, `scroll_line_up`, `next_layout`)
# for vim-style `neighboring_window {left,down,up,right}`; `f` swaps
# kitty's `move_window_forward` for `next_window` (round-robin focus).
# See `intentional-overrides.conf` for chord-by-chord rationale, and
# openspec/changes/phase1-curated-bindings/design.md D5/D6 +
# docs/repro/h12-bindings-window-nav.md.

map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
map ctrl+shift+w close_window
map ctrl+shift+f next_window
