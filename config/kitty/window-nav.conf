# Phase 1 §5 — window navigation (revert).
#
# After phase1-curated-bindings-revert-defaults: every line here is a
# redundant rebind of a kitty 0.46.x default. The category exists so
# `my-kitty keys` groups these chords under `window-nav` rather than
# scattering them under "kitty defaults". The historical vim-style
# hjkl mapping has been dropped — kitty's `show_scrollback`,
# `scroll_line_down`, `scroll_line_up`, and `next_layout` chords are
# released back to kitty (the user does not use vim heavily and the
# `next_layout` chord is load-bearing for their `enter`/`l` workflow).
#
# See openspec/changes/phase1-curated-bindings-revert-defaults/design.md D1
# and docs/repro/h19-bindings-revert.md.
#
# All four lines below are redundant rebinds (same action as the kitty
# default); none need an allow-list entry — same-action equality is
# detected by the introspection module.

map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f move_window_forward
map ctrl+shift+w close_window
