# Phase 1 §1 — new tabs / OS windows / splits inherit the launching window's cwd.
# Candidate bindings; verified against a real kitty session by the autonomous
# integration test in tests/integration/test_h01_cwd.py (KITTI_INTEGRATION=1).

# New tab in current OS window, in the launching window's cwd.
map ctrl+shift+t launch --type=tab --cwd=current

# New OS window, in the launching window's cwd.
map ctrl+shift+n launch --type=os-window --cwd=current

# New window (split) in the current tab, in the launching window's cwd.
map ctrl+shift+enter launch --location=after --cwd=current

# Vertical / horizontal split variants.
map ctrl+shift+\ launch --location=vsplit --cwd=current
map ctrl+shift+- launch --location=hsplit --cwd=current
