# Phase 1 §1 — new tabs / OS windows / new windows inherit the launching
# window's cwd. Verified by tests/integration/test_h01_cwd.py.
#
# After phase1-curated-bindings-revert-defaults: the standalone vsplit/hsplit
# chord pair (`ctrl+shift+\` and `ctrl+shift+/`) was removed. kitty's
# `launch --location=vsplit/hsplit` is only honoured under the `splits`
# layout — we deliberately do NOT pin `enabled_layouts splits` because that
# would remove the user's `next_layout` workflow. The new split workflow is
# kitty's compose model: `ctrl+shift+enter` opens a new window, then
# `ctrl+shift+l` (kitty's default `next_layout`, restored by D1) cycles the
# layout to flip stacked ↔ side-by-side.
#
# See openspec/changes/phase1-curated-bindings-revert-defaults/design.md D2.

# New tab in current OS window, in the launching window's cwd.
map ctrl+shift+t launch --type=tab --cwd=current

# New OS window, in the launching window's cwd.
map ctrl+shift+n launch --type=os-window --cwd=current

# New window in the current tab, in the launching window's cwd.
# Placement follows the active layout — cycle with ctrl+shift+l.
map ctrl+shift+enter launch --cwd=current
