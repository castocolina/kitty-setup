# AI scene — claude (left) + shell (right), equal halves.
#
#   cp examples/scenes/ai-claude.toml ~/.config/kitty-setup/scenes/
#   my-kitty scene launch ai-claude
#
# Two panes side by side at 50/50 (the `horizontal` layout). The agent pane is
# pane 0, so when launched from inside kitty it reuses the window you ran the
# command in — your interactive shell, where your `claude` alias applies.

layout     = "horizontal"   # 50/50 columns side by side
tab_title  = "🤖 claude"
tab_accent = "#d97757"

[[pane]]
title = "claude"
cmd   = "claude"

[[pane]]
title = "shell"
