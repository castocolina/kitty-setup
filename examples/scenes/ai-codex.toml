# AI scene — codex (left) + shell (right), equal halves.
#
#   cp examples/scenes/ai-codex.toml ~/.config/kitty-setup/scenes/
#   my-kitty scene launch ai-codex
#
# Two panes side by side at 50/50 (the `horizontal` layout). The agent pane is
# pane 0; launched from inside kitty it reuses your current shell window.

layout     = "horizontal"   # 50/50 columns side by side
tab_title  = "🤖 codex"
tab_accent = "#10a37f"

[[pane]]
title = "codex"
cmd   = "codex"

[[pane]]
title = "shell"
