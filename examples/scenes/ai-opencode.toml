# AI scene — opencode (left) + shell (right), equal halves.
#
#   cp examples/scenes/ai-opencode.toml ~/.config/kitty-setup/scenes/
#   my-kitty scene launch ai-opencode
#
# Two panes side by side at 50/50 (the `horizontal` layout). The agent pane is
# pane 0; launched from inside kitty it reuses your current shell window.

layout     = "horizontal"   # 50/50 columns side by side
tab_title  = "🤖 opencode"
tab_accent = "#0074d9"

[[pane]]
title = "opencode"
cmd   = "opencode"

[[pane]]
title = "shell"
