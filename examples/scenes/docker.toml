# Sample scene — Docker dashboard (multi-pane → opens a NEW tab).
#
# `my-kitty install` seeds this into ~/.config/kitty-setup/scenes/ (copy-if-absent;
# your edits are never overwritten). Edit it there, then launch by name:
#   my-kitty scene launch docker
#
# Panes with no `cwd` inherit the directory you launched from. In TOML a literal
# comma inside a value needs no escaping (unlike the inline --pane form).
#
# Layout: plain `tall` puts the FIRST pane (shell) large on the LEFT; the two
# docker panes stack on the RIGHT.

layout     = "tall"
tab_title  = "🐳 docker"
# Colors accept names (translated to hex by my-kitty) or hex with/without '#'.
tab_accent = "blue"

[[pane]]
title = "shell"
bg    = "cyan"

[[pane]]
title = "docker-ps"
bg    = "orange"
cmd   = "docker-ps ; exec bash"

[[pane]]
title = "docker-memory"
bg    = "teal"
cmd   = "docker-memory ; exec bash"
