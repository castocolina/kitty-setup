[project]
name = "kitty-setup"
version = "0.0.0"
description = "Hypothesis-driven Kitty terminal foundation + scenes toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "kitty-setup contributors" }]
dependencies = [
    "argcomplete>=3.5,<4",
]

[project.scripts]
my-kitty = "kitty_setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitty_setup"]

[tool.hatch.build.targets.wheel.force-include]
# Ship config/kitty/ inside the wheel so `uv tool install` (non-editable)
# carries the payload with the binary. The dev `uv sync` install is editable
# and does NOT trigger force-include — the installer falls back to the
# repo-root config/kitty/ via Path(__file__).parents[2] in that case.
"config/kitty" = "kitty_setup/_payload/kitty"
# Ship the example scene recipes so `my-kitty install` can seed them into the
# user scenes dir (copy-if-absent) from the installed binary, without the repo.
# Editable `uv sync` skips force-include; the installer falls back to repo-root
# examples/scenes/ the same way the payload does.
"examples/scenes" = "kitty_setup/_scenes"

[dependency-groups]
dev = [
    "black>=24.10.0",
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "bandit>=1.7.10",
    "vulture>=2.13",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Lint-only; black is the formatter (D3 in design.md).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # bandit-lite
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point in tests.
# S108: tests pass literal "/tmp/x" paths to argparse; never touched on disk.
# S604: tests pass `shell="zsh"` to path_integration helpers (not subprocess shell).
"tests/**/*.py" = ["S101", "S108", "S604"]
# S603: test_git_hooks.py's `_git` helper passes a fixed literal argv list with shell=False;
#       there is no untrusted input to check for.
# S607: the same helper names the `git` binary without an absolute path on purpose — the test
#       must exercise whichever `git` the host resolves from PATH, which is the one a developer
#       and a hook actually run.
# Scoped to this one file rather than appended to the "tests/**/*.py" list above, which is what
# 01-01-PLAN.md Step 1b asked for: measured, appending them there suppresses pre-existing
# `# noqa: S603` directives in five other test modules and turns each into a RUF100 "unused
# noqa" finding — growing the repo's recorded lint baseline from 19 findings to 21 instead of
# holding it. The narrower entry holds it at 19. See 01-01-SUMMARY.md "Deviations".
"tests/unit/test_git_hooks.py" = ["S603", "S607"]
# S603/S607: test_tools_uninstall_sh.py (R1.3, 02-03) runs a fixed argv of `bash` and the tracked
#       tools/uninstall.sh with shell=False and a complete replacement env built from literals and
#       tmp_path values. `bash` is named without an absolute path on purpose: it is resolved from
#       that sandbox PATH, never the developer's. Scoped to this one file for the reason above.
"tests/unit/test_tools_uninstall_sh.py" = ["S603", "S607"]
# S603: the headless integration runner (R0.13, 02-11) passes every argv as a list with
#       shell=False, built from shutil.which's absolute compositor path and sys.executable.
#       The only caller-supplied part is the developer's own PYTEST_ARGS, which reaches pytest
#       as arguments and never a shell. Scoped to this one file for the reason given above.
"src/kitty_setup/harness/integration_runner.py" = ["S603"]
# S603: the completion e2e module (R1.1, 02-02) starts real bash and zsh with a list argv and
#       shell=False; the shell path comes from shutil.which and the script text is a module
#       literal, so no untrusted input reaches the call. Scoped to this one file for the reason
#       given above.
"tests/integration/test_completion_e2e.py" = ["S603"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.bandit]
exclude_dirs = ["tests", "tmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires KITTI_INTEGRATION=1 and a real kitty install",
]
