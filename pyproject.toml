[project]
name = "kitty-setup"
version = "0.0.0"
description = "Hypothesis-driven Kitty terminal foundation + scenes toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "kitty-setup contributors" }]
dependencies = []

[project.scripts]
my-kitty-setup = "kitty_setup.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitty_setup"]

[tool.hatch.build.targets.wheel.force-include]
# Ship config/kitty/ inside the wheel so `uv tool install` (non-editable)
# carries the payload with the binary. The dev `uv sync` install is editable
# and does NOT trigger force-include — the installer falls back to the
# repo-root config/kitty/ via Path(__file__).parents[2] in that case.
"config/kitty" = "kitty_setup/_payload/kitty"

[dependency-groups]
dev = [
    "black>=24.10.0",
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "bandit>=1.7.10",
    "vulture>=2.13",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.uv]
package = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Lint-only; black is the formatter (D3 in design.md).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # bandit-lite
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the point in tests.
# S108: tests pass literal "/tmp/x" paths to argparse; never touched on disk.
# S604: tests pass `shell="zsh"` to path_integration helpers (not subprocess shell).
"tests/**/*.py" = ["S101", "S108", "S604"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.bandit]
exclude_dirs = ["tests", "tmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires KITTI_INTEGRATION=1 and a real kitty install",
]
